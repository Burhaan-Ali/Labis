<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Wardrobe Manager</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- TOP NAVBAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
          <i class="fa-solid me-0 fa-shirt text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">WardrobeHub</h1>
          <p class="text-xs text-slate-500">Smart Closet & Outfit Planner</p>
        </div>
      </div>
      <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition-all shadow-sm active:scale-95">
        <i class="fa-solid fa-plus"></i>
        <span>Add Clothes</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- DASHBOARD STATS CARD BAR -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-400">Total Items</p>
          <p id="stat-total" class="text-2xl font-black text-slate-800 mt-1">0</p>
        </div>
        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-boxes-stacked"></i>
        </div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-400">Clean & Ready</p>
          <p id="stat-clean" class="text-2xl font-black text-emerald-600 mt-1">0</p>
        </div>
        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-sparkles"></i>
        </div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-400">In Laundry</p>
          <p id="stat-laundry" class="text-2xl font-black text-amber-600 mt-1">0</p>
        </div>
        <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-jug-detergent"></i>
        </div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-400">Favorite Pieces</p>
          <p id="stat-favs" class="text-2xl font-black text-rose-600 mt-1">0</p>
        </div>
        <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-heart"></i>
        </div>
      </div>
    </section>

    <!-- SEARCH & FILTER CONTROLS -->
    <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
        <!-- Search bar -->
        <div class="relative w-full md:w-96">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="searchInput" oninput="renderItems()" placeholder="Search by name, color, tag..." 
                 class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition-all">
        </div>

        <!-- Filter Selects -->
        <div class="flex flex-wrap gap-2 w-full md:w-auto">
          <select id="filterCategory" onchange="renderItems()" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="All">All Categories</option>
            <option value="Tops">Tops</option>
            <option value="Bottoms">Bottoms</option>

            <option value="Outerwear">Outerwear</option>
            <option value="Shoes">Shoes</option>
            <option value="Accessories">Accessories</option>
          </select>

          <select id="filterStatus" onchange="renderItems()" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="All">All Statuses</option>
            <option value="Clean">Clean</option>
            <option value="Laundry">In Laundry</option>
          </select>

          <select id="filterSeason" onchange="renderItems()" class="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="All">All Seasons</option>
            <option value="All Season">All Season</option>
            <option value="Summer">Summer</option>
            <option value="Winter">Winter</option>
            <option value="Spring/Autumn">Spring/Autumn</option>
          </select>
        </div>
      </div>
    </section>

    <!-- CLOTHING GRID DISPLAY -->
    <section>
      <div id="clothingGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Dynamic JS Rendering Cards Here -->
      </div>
      <!-- Empty state -->
      <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
        <i class="fa-solid fa-shirt text-5xl text-slate-300 mb-3"></i>
        <h3 class="text-base font-semibold text-slate-700">No items found</h3>
        <p class="text-xs text-slate-400 mt-1">Try adjusting your filters or add a new piece to your wardrobe.</p>
      </div>
    </section>
  </main>

  <!-- ADD / EDIT MODAL -->
  <div id="itemModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden animate-in fade-in zoom-in duration-150">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-lg">Add New Item</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <form id="itemForm" onsubmit="saveItem(event)" class="p-6 space-y-4">
        <input type="hidden" id="itemId">

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Item Title</label>
          <input type="text" id="itemName" required placeholder="e.g. Blue Denim Jacket" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Category</label>
            <select id="itemCategory" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
              <option value="Tops">Tops</option>
              <option value="Bottoms">Bottoms</option>
              <option value="Outerwear">Outerwear</option>
              <option value="Shoes">Shoes</option>
              <option value="Accessories">Accessories</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Color</label>
            <input type="text" id="itemColor" required placeholder="e.g. Navy Blue" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Season</label>
            <select id="itemSeason" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
              <option value="All Season">All Season</option>
              <option value="Summer">Summer</option>
              <option value="Winter">Winter</option>
              <option value="Spring/Autumn">Spring/Autumn</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Status</label>
            <select id="itemStatus" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
              <option value="Clean">Clean</option>
              <option value="Laundry">In Laundry</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Image URL</label>
          <input type="url" id="itemImage" placeholder="https://images.unsplash.com/..." class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          <p class="text-[11px] text-slate-400 mt-1">Leave empty to use default placeholder image.</p>
        </div>

        <div class="flex items-center gap-2 pt-2">
          <input type="checkbox" id="itemFavorite" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
          <label for="itemFavorite" class="text-sm text-slate-700 font-medium">Mark as Favorite</label>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm font-medium">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium shadow-sm">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- APP LOGIC (JAVASCRIPT) -->
  <script>
    // Sample initial items if LocalStorage is empty
    const initialItems = [
      {
        id: "1",
        name: "Classic White T-Shirt",
        category: "Tops",
        color: "White",
        season: "All Season",
        status: "Clean",
        image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=600&q=80",
        favorite: true
      },
      {
        id: "2",
        name: "Slim Fit Blue Jeans",
        category: "Bottoms",
        color: "Blue",
        season: "All Season",
        status: "Clean",
        image: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=600&q=80",
        favorite: true
      },
      {
        id: "3",
        name: "Black Leather Jacket",
        category: "Outerwear",
        color: "Black",
        season: "Winter",
        status: "Clean",
        image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=600&q=80",
        favorite: false
      },
      {
        id: "4",
        name: "White Running Sneakers",
        category: "Shoes",
        color: "White",
        season: "All Season",
        status: "Laundry",
        image: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?auto=format&fit=crop&w=600&q=80",
        favorite: false
      }
    ];

    // State
    let wardrobe = JSON.parse(localStorage.getItem('wardrobe_items')) || initialItems;

    // Save to LocalStorage
    function saveData() {
      localStorage.setItem('wardrobe_items', JSON.stringify(wardrobe));
    }

    // Update Top Dashboard Numbers
    function updateStats() {
      document.getElementById('stat-total').textContent = wardrobe.length;
      document.getElementById('stat-clean').textContent = wardrobe.filter(i => i.status === 'Clean').length;
      document.getElementById('stat-laundry').textContent = wardrobe.filter(i => i.status === 'Laundry').length;
      document.getElementById('stat-favs').textContent = wardrobe.filter(i => i.favorite).length;
    }

    // Render Clothing Cards
    function renderItems() {
      updateStats();

      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const catVal = document.getElementById('filterCategory').value;
      const statusVal = document.getElementById('filterStatus').value;
      const seasonVal = document.getElementById('filterSeason').value;

      const filtered = wardrobe.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(searchVal) || item.color.toLowerCase().includes(searchVal);
        const matchesCat = catVal === 'All' || item.category === catVal;
        const matchesStatus = statusVal === 'All' || item.status === statusVal;
        const matchesSeason = seasonVal === 'All' || item.season === seasonVal;

        return matchesSearch && matchesCat && matchesStatus && matchesSeason;
      });

      const grid = document.getElementById('clothingGrid');
      const emptyState = document.getElementById('emptyState');

      grid.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        filtered.forEach(item => {
          const defaultImg = "https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?auto=format&fit=crop&w=600&q=80";
          const imgUrl = item.image && item.image.trim() !== '' ? item.image : defaultImg;

          const card = document.createElement('div');
          card.className = "bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-all group flex flex-col";
          card.innerHTML = `
            <div class="relative h-52 bg-slate-100 overflow-hidden">
              <img src="${imgUrl}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='${defaultImg}'">
              
              <button onclick="toggleFavorite('${item.id}')" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/80 backdrop-blur-md flex items-center justify-center text-slate-600 hover:text-rose-500 transition-colors shadow-sm">
                <i class="${item.favorite ? 'fa-solid text-rose-500' : 'fa-regular'} fa-heart"></i>
              </button>

              <span class="absolute bottom-3 left-3 px-2.5 py-1 rounded-full text-[11px] font-semibold backdrop-blur-md ${
                item.status === 'Clean' ? 'bg-emerald-500/90 text-white' : 'bg-amber-500/90 text-white'
              }">
                ${item.status}
              </span>
            </div>

            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start gap-2">
                  <h3 class="font-bold text-slate-800 text-sm line-clamp-1">${item.name}</h3>
                </div>
                <div class="flex flex-wrap gap-1.5 mt-2">
                  <span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 text-[11px] font-medium">${item.category}</span>
                  <span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 text-[11px] font-medium">${item.color}</span>
                  <span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 text-[11px] font-medium">${item.season}</span>
                </div>
              </div>

              <div class="flex items-center justify-between pt-4 mt-3 border-t border-slate-100 text-xs">
                <button onclick="toggleStatus('${item.id}')" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1">
                  <i class="fa-solid fa-arrows-rotate"></i> Toggle Status
                </button>
                <div class="flex items-center gap-2">
                  <button onclick="editItem('${item.id}')" class="text-slate-400 hover:text-slate-700 p-1">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button onclick="deleteItem('${item.id}')" class="text-slate-400 hover:text-rose-600 p-1">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      }
    }

    // Modal Control Functions
    function openModal(editId = null) {
      document.getElementById('itemModal').classList.remove('hidden');
      if (!editId) {
        document.getElementById('modalTitle').textContent = "Add New Item";
        document.getElementById('itemForm').reset();
        document.getElementById('itemId').value = "";
      }
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    // Save/Update Item Function
    function saveItem(e) {
      e.preventDefault();
      const id = document.getElementById('itemId').value;
      const name = document.getElementById('itemName').value;
      const category = document.getElementById('itemCategory').value;
      const color = document.getElementById('itemColor').value;
      const season = document.getElementById('itemSeason').value;
      const status = document.getElementById('itemStatus').value;
      const image = document.getElementById('itemImage').value;
      const favorite = document.getElementById('itemFavorite').checked;

      if (id) {
        // Edit existing
        const index = wardrobe.findIndex(i => i.id === id);
        if (index !== -1) {
          wardrobe[index] = { id, name, category, color, season, status, image, favorite };
        }
      } else {
        // Create new
        const newItem = {
          id: Date.now().toString(),
          name, category, color, season, status, image, favorite
        };
        wardrobe.unshift(newItem);
      }

      saveData();
      renderItems();
      closeModal();
    }

    // Edit Item Handler
    function editItem(id) {
      const item = wardrobe.find(i => i.id === id);
      if (!item) return;

      document.getElementById('modalTitle').textContent = "Edit Item";
      document.getElementById('itemId').value = item.id;
      document.getElementById('itemName').value = item.name;
      document.getElementById('itemCategory').value = item.category;
      document.getElementById('itemColor').value = item.color;
      document.getElementById('itemSeason').value = item.season;
      document.getElementById('itemStatus').value = item.status;
      document.getElementById('itemImage').value = item.image;
      document.getElementById('itemFavorite').checked = item.favorite;

      openModal(id);
    }

    // Action Helpers
    function toggleFavorite(id) {
      const item = wardrobe.find(i => i.id === id);
      if (item) {
        item.favorite = !item.favorite;
        saveData();
        renderItems();
      }
    }

    function toggleStatus(id) {
      const item = wardrobe.find(i => i.id === id);
      if (item) {
        item.status = item.status === 'Clean' ? 'Laundry' : 'Clean';
        saveData();
        renderItems();
      }
    }

    function deleteItem(id) {
      if (confirm('Are you sure you want to remove this item?')) {
        wardrobe = wardrobe.filter(i => i.id !== id);
        saveData();
        renderItems();
      }
    }

    // Initial Load
    document.addEventListener('DOMContentLoaded', renderItems);
  </script>
</body>
</html>
